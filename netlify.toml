# Netlify builds the static site. Card data and images are committed (run `npm run sync` locally first).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/cards/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
